; Build from the repository root:
;   pio run -e lolin_s2_mini          (build)
;   pio run -e lolin_s2_mini -t upload (flash)
;
; ESP8266Audio is pinned to exactly 1.9.9 -- the release the vendored
; AudioFileSourceHTTPStreamUA copy in radio80s_esp32s2/ was derived from.

[platformio]
src_dir = radio80s_esp32s2

[env:lolin_s2_mini]
platform = espressif32@6.12.0
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    earlephilhower/ESP8266Audio@1.9.9
